<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      SEO žymos (title, description, Open Graph, JSON-LD) valdomos App.jsx
      ir build metu įrašomos čia (scripts/prerender.mjs).
    -->

    <!-- FAVICON -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-5M9C3TTG9Z"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      // Google Consent Mode: statistika renkama tik gavus sutikimą (CookieConsent.jsx)
      var consent = null;
      try {
        consent = localStorage.getItem('cookie-consent');
      } catch (e) {}
      gtag('consent', 'default', {
        analytics_storage: consent === 'granted' ? 'granted' : 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
      });
      gtag('js', new Date());

      gtag('config', 'G-5M9C3TTG9Z');
    </script>

    <!-- VITE -->
    <script type="module" src="/src/main.jsx"></script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
